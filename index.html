<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090B" />
    <meta name="color-scheme" content="dark" />

    <!--
      ====================== DEMO MODU ======================
      Bu sayfa GKM'ye satış görüşmesinde gösterilmek üzere hazırlanmış BAĞIMSIZ
      bir konsept çalışmadır; GKM'nin resmî sitesi DEĞİLDİR.

      Bu yüzden arama motorlarına kapalıdır ve işletme yapılandırılmış verisi
      (schema.org) yayında değildir. Resmî yayına geçiş adımları README.md →
      "Resmî yayın modu" bölümünde.
      =======================================================
    -->

    <title>GKM için Hazırlanmış Landing Page Konsepti</title>
    <meta
      name="description"
      content="Bağımsız konsept çalışma. Maltepe'deki GKM Oto Cam Filmi ve Araç Kaplama için hazırlanmış örnek landing page tasarımı — işletmenin resmî web sitesi değildir."
    />

    <!--
      Arama motorlarına kapalı.

      `noindex` burada asıl korumadır: robots.txt yalnızca taramayı engeller,
      indekslemeyi değil. Ayrıca GitHub Pages projeyi alt dizinde yayınladığı
      için (/gkm-landing/) robots.txt tarayıcılar tarafından okunmaz —
      robots.txt yine de niyeti belgelemek ve özel alan adına taşınma ihtimali
      için depoda tutulur. Ayrıntı: README → "Demo modu".
    -->
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="author" content="Bağımsız konsept çalışma" />
    <!-- canonical, yayınlandığı gerçek adresten main.tsx içinde eklenir -->

    <!-- Open Graph / Twitter — paylaşımda resmî site izlenimi vermemeli -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="Konsept çalışma — resmî site değildir" />
    <meta property="og:title" content="GKM için Hazırlanmış Landing Page Konsepti" />
    <meta
      property="og:description"
      content="Bağımsız konsept çalışma. Maltepe'deki GKM Oto Cam Filmi ve Araç Kaplama için hazırlanmış örnek landing page — GKM'nin resmî web sitesi değildir."
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%og-gkm.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="GKM için hazırlanmış landing page konsepti — bağımsız konsept çalışma, resmî site değildir"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GKM için Hazırlanmış Landing Page Konsepti" />
    <meta
      name="twitter:description"
      content="Bağımsız konsept çalışma — GKM'nin resmî web sitesi değildir."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%og-gkm.jpg" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./og-gkm.jpg" />

    <!--
      İŞLETME YAPILANDIRILMIŞ VERİSİ (schema.org) — DEMO MODUNDA KAPALI

      AutoRepair / LocalBusiness, AggregateRating, adres, çalışma saatleri ve
      hizmet teklifleri içeren JSON-LD verisi bilinçli olarak yayınlanmıyor.
      Aksi hâlde arama motorları bu sayfayı GKM'nin resmî işletme sitesi olarak
      değerlendirebilir.

      Hazır JSON şurada duruyor:  docs/schema-localbusiness.json
      Resmî yayına geçerken içeriğini bir JSON-LD script etiketine yapıştırın ve
      puanı/saatleri o günkü değerlerle güncelleyin (README → Resmî yayın modu).

      Not: bu blok bir HTML yorumudur; arama motorları yorum içeriğini
      yapılandırılmış veri olarak okumaz.
    -->
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 2rem; font-family: system-ui; color: #f4f6f9; background: #08090b">
        <p style="color: #e8a33d; font-weight: 600">
          Bağımsız konsept çalışma — GKM'nin resmî web sitesi değildir.
        </p>
        <h1>GKM Oto Cam Filmi ve Araç Kaplama</h1>
        <p>Bu sayfayı görüntülemek için JavaScript'i etkinleştirin.</p>
        <p>
          İşletmenin herkese açık iletişim bilgisi:
          <a style="color: #e8a33d" href="tel:+905359654121">0535 965 41 21</a> —
          Altayçeşme Mah., Adalı Sk. No: 10, 34843 Maltepe / İstanbul
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
