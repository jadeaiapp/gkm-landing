name: GitHub Pages'e yayınla

# main dalına her push'ta site otomatik derlenir ve GitHub Pages'e yayınlanır.
on:
  push:
    branches: [main]
  workflow_dispatch: # Actions sekmesinden elle de çalıştırılabilir

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın çalışsın; devam eden yayın iptal edilmesin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Derle
    runs-on: ubuntu-latest
    steps:
      - name: Kodu çek
        uses: actions/checkout@v7

      - name: Node.js kur
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Bağımlılıkları yükle
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Pages yapılandırmasını al
        uses: actions/configure-pages@v6

      - name: Çıktıyı yükle
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Yayınla
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e dağıt
        id: deployment
        uses: actions/deploy-pages@v5
